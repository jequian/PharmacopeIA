  # ---- Glutamato y GABA ------------------------------------------
  - {id: mol:NMDA, name: "Receptor NMDA", subtype: receptor_ionotropico}
  - {id: mol:AMPA, name: "Receptor AMPA", subtype: receptor_ionotropico}
  - {id: mol:GABAA, name: "Receptor GABA-A", subtype: receptor_ionotropico}
  - {id: mol:GABAA-extrasinaptico, name: "Receptor GABA-A extrasináptico", subtype: receptor_ionotropico}

  # ---- Enzimas ---------------------------------------------------
