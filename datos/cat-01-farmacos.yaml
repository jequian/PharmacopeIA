# =====================================================================
# CATÁLOGO 01 — Fármacos y blancos moleculares
# =====================================================================
# Solo NODOS. Las aristas acts_on se cargan por contraste, no en bloque:
# cargar 55 fármacos × 15 blancos de memoria produciría ~400 aristas con
# referencia PENDIENTE, es decir el montón que queremos evitar.
#
# Un fármaco puede estar aquí sin ninguna arista. Eso es correcto: el
# catálogo declara qué existe; los contrastes declaran qué sabemos.
# =====================================================================

meta:
  schema_version: "0.1"
  catalog_id: "cat-01-farmacos"
  verified: false

drugs:

  # ---- ISRS ------------------------------------------------------
  - {id: drug:fluoxetina,   name: Fluoxetina,   class: antidepresivo, approval_status: aprobado}
  - {id: drug:sertralina,   name: Sertralina,   class: antidepresivo, approval_status: aprobado}
  - {id: drug:paroxetina,   name: Paroxetina,   class: antidepresivo, approval_status: aprobado}
  - {id: drug:citalopram,   name: Citalopram,   class: antidepresivo, approval_status: aprobado}
  - {id: drug:escitalopram, name: Escitalopram, class: antidepresivo, approval_status: aprobado}
  - {id: drug:fluvoxamina,  name: Fluvoxamina,  class: antidepresivo, approval_status: aprobado}

  # ---- Duales y noradrenérgicos ----------------------------------
  - {id: drug:venlafaxina,    name: Venlafaxina,    class: antidepresivo, approval_status: aprobado}
  - {id: drug:desvenlafaxina, name: Desvenlafaxina, class: antidepresivo, approval_status: aprobado}
  - {id: drug:duloxetina,     name: Duloxetina,     class: antidepresivo, approval_status: aprobado}
  - {id: drug:levomilnaciprán, name: Levomilnaciprán, class: antidepresivo, approval_status: aprobado}
  - {id: drug:reboxetina,     name: Reboxetina,     class: antidepresivo, approval_status: aprobado_otra_indicacion}
  - {id: drug:atomoxetina,    name: Atomoxetina,    class: estimulante,   approval_status: aprobado_otra_indicacion}

  # ---- Tricíclicos y tetracíclicos -------------------------------
  - {id: drug:imipramina,   name: Imipramina,   class: antidepresivo, approval_status: aprobado}
  - {id: drug:amitriptilina, name: Amitriptilina, class: antidepresivo, approval_status: aprobado}
  - {id: drug:clomipramina, name: Clomipramina, class: antidepresivo, approval_status: aprobado,
     notes: "Único tricíclico con eficacia establecida en TOC. Es en sí
             mismo un contraste pendiente frente al resto de la clase."}
  - {id: drug:nortriptilina, name: Nortriptilina, class: antidepresivo, approval_status: aprobado}
  - {id: drug:desipramina,  name: Desipramina,  class: antidepresivo, approval_status: aprobado}
  - {id: drug:maprotilina,  name: Maprotilina,  class: antidepresivo, approval_status: aprobado}
  - {id: drug:amoxapina,    name: Amoxapina,    class: antidepresivo, approval_status: aprobado}

  # ---- IMAO ------------------------------------------------------
  - {id: drug:fenelzina,      name: Fenelzina,      class: antidepresivo, approval_status: aprobado}
  - {id: drug:tranilcipromina, name: Tranilcipromina, class: antidepresivo, approval_status: aprobado}
  - {id: drug:selegilina,     name: Selegilina,     class: antidepresivo, approval_status: aprobado}
  - {id: drug:moclobemida,    name: Moclobemida,    class: antidepresivo, approval_status: aprobado}

  # ---- Antidepresivos de mecanismo atípico -----------------------
  - {id: drug:bupropion,    name: Bupropión,    class: antidepresivo, approval_status: aprobado}
  - {id: drug:mirtazapina,  name: Mirtazapina,  class: antidepresivo, approval_status: aprobado}
  - {id: drug:trazodona,    name: Trazodona,    class: antidepresivo, approval_status: aprobado}
  - {id: drug:vortioxetina, name: Vortioxetina, class: antidepresivo, approval_status: aprobado}
  - {id: drug:vilazodona,   name: Vilazodona,   class: antidepresivo, approval_status: aprobado}
  - {id: drug:agomelatina,  name: Agomelatina,  class: antidepresivo, approval_status: aprobado}
  - {id: drug:tianeptina,   name: Tianeptina,   class: antidepresivo, approval_status: aprobado_otra_indicacion,
     notes: "Contraste valioso: potencia la recaptura de serotonina —
             dirección opuesta a los ISRS — y tiene eficacia reportada.
             Agonista mu. Desafía la hipótesis monoaminérgica de frente."}

  # ---- Glutamatérgicos y de acción rápida ------------------------
  - {id: drug:ketamina,   name: Ketamina,   class: experimental, approval_status: uso_no_aprobado}
  - {id: drug:esketamina, name: Esketamina, class: antidepresivo, approval_status: aprobado}
  - {id: drug:dextrometorfano-bupropion, name: "Dextrometorfano-bupropión",
     class: antidepresivo, approval_status: aprobado}

  # ---- Neuroesteroides -------------------------------------------
  - {id: drug:brexanolona, name: Brexanolona, class: neuroesteroide, approval_status: aprobado}
  - {id: drug:zuranolona,  name: Zuranolona,  class: neuroesteroide, approval_status: aprobado,
     notes: "Eficaz en depresión posparto; fracasó en depresión mayor
             general. Contraste de enriquecimiento por subpoblación
             biológicamente definida — pendiente de cargar."}

  # ---- Antipsicóticos con efecto afectivo ------------------------
  - {id: drug:quetiapina,  name: Quetiapina,  class: antipsicotico, approval_status: aprobado,
     notes: "Indicada en manía, depresión bipolar, coadyuvante en depresión
             mayor, y usada fuera de indicación para insomnio y ansiedad.
             La promiscuidad terapéutica es un dato sobre la nosología."}
  - {id: drug:lurasidona,  name: Lurasidona,  class: antipsicotico, approval_status: aprobado}
  - {id: drug:olanzapina,  name: Olanzapina,  class: antipsicotico, approval_status: aprobado}
  - {id: drug:aripiprazol, name: Aripiprazol, class: antipsicotico, approval_status: aprobado}
  - {id: drug:cariprazina, name: Cariprazina, class: antipsicotico, approval_status: aprobado}
  - {id: drug:brexpiprazol, name: Brexpiprazol, class: antipsicotico, approval_status: aprobado}
  - {id: drug:risperidona, name: Risperidona, class: antipsicotico, approval_status: aprobado}
  - {id: drug:haloperidol, name: Haloperidol, class: antipsicotico, approval_status: aprobado}
  - {id: drug:clozapina,   name: Clozapina,   class: antipsicotico, approval_status: aprobado}
  - {id: drug:lumateperona, name: Lumateperona, class: antipsicotico, approval_status: aprobado}
  - {id: drug:xanomelina-trospio, name: "Xanomelina-trospio", class: antipsicotico,
     approval_status: aprobado,
     notes: "Primera aprobación antipsicótica sin bloqueo D2. El beneficio
             cognitivo aparece solo en pacientes con cognición basal pobre
             — estratificación replicada prospectivamente."}

  # ---- Estabilizador ---------------------------------------------
  - {id: drug:litio, name: Litio, class: estabilizador, approval_status: aprobado,
     notes: "El fármaco más eficaz de la psiquiatría y el de mecanismo
             menos resuelto. Candidatos: GSK-3 beta, depleción de inositol,
             regulación circadiana."}

  # ---- Anticrisis: con efecto afectivo positivo ------------------
  - {id: drug:lamotrigina,  name: Lamotrigina,  class: anticrisis, approval_status: aprobado}
  - {id: drug:valproato,    name: Valproato,    class: estabilizador, approval_status: aprobado}
  - {id: drug:carbamazepina, name: Carbamazepina, class: anticrisis, approval_status: aprobado}
  - {id: drug:oxcarbazepina, name: Oxcarbazepina, class: anticrisis, approval_status: aprobado_otra_indicacion}

  # ---- Anticrisis: sin señal afectiva (controles negativos) ------
  - {id: drug:fenitoina,   name: Fenitoína,   class: anticrisis, approval_status: aprobado_otra_indicacion}
  - {id: drug:lacosamida,  name: Lacosamida,  class: anticrisis, approval_status: aprobado_otra_indicacion}
  - {id: drug:topiramato,  name: Topiramato,  class: anticrisis, approval_status: aprobado_otra_indicacion}
  - {id: drug:zonisamida,  name: Zonisamida,  class: anticrisis, approval_status: aprobado_otra_indicacion}
  - {id: drug:gabapentina, name: Gabapentina, class: anticrisis, approval_status: aprobado_otra_indicacion}
  - {id: drug:pregabalina, name: Pregabalina, class: ansiolitico, approval_status: aprobado}

  # ---- Anticrisis: con efecto afectivo NEGATIVO ------------------
  # Estos son tan informativos como los positivos: un fármaco que INDUCE
  # un fenotipo es evidencia causal de mejor calidad que uno que lo trata.
  - {id: drug:levetiracetam, name: Levetiracetam, class: anticrisis, approval_status: aprobado_otra_indicacion,
     notes: "Irritabilidad, disforia y agresividad en una fracción
             sustancial. Arista 'induces' pendiente de cargar."}
  - {id: drug:perampanel,   name: Perampanel,   class: anticrisis, approval_status: aprobado_otra_indicacion,
     notes: "Advertencia regulatoria por agresividad y hostilidad.
             Antagonista AMPA — dirección opuesta a los moduladores
             alostéricos positivos de AMPA en desarrollo para depresión.
             Contraste de alto valor, pendiente."}
  - {id: drug:vigabatrina,  name: Vigabatrina,  class: anticrisis, approval_status: aprobado_otra_indicacion}

  # ---- Otros con efecto afectivo documentado ---------------------
  - {id: drug:reserpina, name: Reserpina, class: hormona, approval_status: retirado,
     notes: "El caso fundacional, y va en sentido contrario: indujo
             depresión y de ahí nació la hipótesis monoaminérgica."}
  - {id: drug:prazosina,   name: Prazosina,   class: experimental, approval_status: uso_no_aprobado}
  - {id: drug:escopolamina, name: Escopolamina, class: experimental, approval_status: uso_no_aprobado}
  - {id: drug:pramipexol,  name: Pramipexol,  class: experimental, approval_status: uso_no_aprobado}
  - {id: drug:infliximab,  name: Infliximab,  class: antiinflamatorio, approval_status: aprobado_otra_indicacion}
  - {id: drug:aticaprant,  name: Aticaprant,  class: experimental, approval_status: discontinuado}
  - {id: drug:navacaprant, name: Navacaprant, class: experimental, approval_status: discontinuado}
  - {id: drug:ezogabina,   name: Ezogabina,   class: anticrisis, approval_status: retirado}
  - {id: drug:seltorexant, name: Seltorexant, class: experimental, approval_status: fase_3}
  - {id: drug:psilocibina, name: Psilocibina, class: psicodelico, approval_status: fase_3}

