  - {id: mol:MAOB, name: "Monoaminooxidasa B", subtype: enzima, gene: MAOB}
  - {id: mol:PDE4, name: "Fosfodiesterasa 4", subtype: enzima}

  # ---- Cascada neurotrófica --------------------------------------
  - {id: mol:mTOR, name: "mTORC1", subtype: cinasa}
  - {id: mol:AKT,  name: "Akt", subtype: cinasa}
  - {id: mol:MEK,  name: "MEK", subtype: cinasa}
  - {id: mol:PLCG1, name: "Fosfolipasa C gamma 1", subtype: enzima,
     notes: "Rama pY816 de TrkB. Implicada tanto en plasticidad como en
             epileptogénesis — misma rama, direcciones opuestas."}
  - {id: mol:CREB, name: "CREB", subtype: factor_transcripcion}
  - {id: mol:TRPC6, name: "Canal TRPC6", subtype: canal_ionico, gene: TRPC6,
     notes: "Efector río abajo de TrkB vía PLC-gamma y diacilglicerol.
             Blanco directo de la hiperforina."}

  # ---- Inmunitarios ----------------------------------------------
  - {id: mol:TNF,  name: "Factor de necrosis tumoral alfa", subtype: citocina}
  - {id: mol:IL6,  name: "Interleucina 6", subtype: citocina}
  - {id: mol:IL1B, name: "Interleucina 1 beta", subtype: citocina}
  - {id: mol:CRP,  name: "Proteína C reactiva", subtype: estructural}

  # ---- Membrana --------------------------------------------------
  - {id: mol:colesterol-membrana, name: "Colesterol de membrana", subtype: lipido_membrana,
     notes: "Cofactor conformacional. El sitio de unión de antidepresivos
             en el dominio transmembrana de TrkB depende de él, con
             relación bifásica."}
